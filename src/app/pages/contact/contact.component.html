<section class="relative h-[320px] w-full overflow-hidden bg-[#0a0a0a]">
  <div class="absolute inset-0 z-0">
    <img src="assets/bannerBackground.png" class="h-full w-full object-cover object-right opacity-60">
    <div class="absolute inset-0 bg-gradient-to-r from-[#0a0a0a] via-[#0a0a0a]/80 to-transparent"></div>
  </div>

  <div class="container mx-auto px-6 md:px-12 h-full flex flex-col justify-center relative z-10 mt-10">
    <div class="flex flex-col items-start gap-3">
      
      <nav class="flex items-center gap-3 text-white text-lg md:text-2xl font-light tracking-widest uppercase leading-none">
        <span class="text-[#00adef] font-black">İLETİŞİM</span>
        <span class="text-white/20 font-thin text-3xl">/</span>
        <span class="font-medium text-white tracking-normal">{{ pageTitle }}</span>
      </nav>

      <div class="w-16 h-1 bg-[#ff0000] shadow-[0_0_10px_rgba(255,0,0,0.5)]"></div>
      
    </div>
  </div>
</section>
<section class="bg-white pb-20">
  <div class="container mx-auto px-6 max-w-7xl">
    
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-stretch -mt-10 relative z-20">
      
      <div class="lg:col-span-7 bg-white p-10 rounded-[3rem] shadow-[0_20px_50px_rgba(0,0,0,0.1)] border border-gray-100">
        <div class="mb-8">
          <h3 class="text-2xl font-black text-black uppercase tracking-tighter mb-1">Bize Mesaj Gönderin</h3>
          <div class="w-12 h-1.5 bg-[#00adef] rounded-full"></div>
        </div>
        
        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
              <label class="text-[11px] font-black text-gray-400 uppercase tracking-widest ml-2">AD SOYAD</label>
              <input formControlName="name" type="text" placeholder="Adınız..." 
                     class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent rounded-2xl text-sm focus:border-[#00adef] focus:bg-white outline-none transition-all shadow-inner">
            </div>
            <div class="space-y-2">
              <label class="text-[11px] font-black text-gray-400 uppercase tracking-widest ml-2">E-POSTA</label>
              <input formControlName="email" type="email" placeholder="E-Posta..." 
                     class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent rounded-2xl text-sm focus:border-[#00adef] focus:bg-white outline-none transition-all shadow-inner">
            </div>
          </div>
          <div class="space-y-2">
            <label class="text-[11px] font-black text-gray-400 uppercase tracking-widest ml-2">KONU</label>
            <input formControlName="subject" type="text" placeholder="Hangi konuda bilgi almak istersiniz?" 
                   class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent rounded-2xl text-sm focus:border-[#00adef] focus:bg-white outline-none transition-all shadow-inner">
          </div>
          <div class="space-y-2">
            <label class="text-[11px] font-black text-gray-400 uppercase tracking-widest ml-2">MESAJINIZ</label>
            <textarea formControlName="message" rows="5" placeholder="Mesajınız..." 
                      class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent rounded-2xl text-sm focus:border-[#00adef] focus:bg-white outline-none transition-all shadow-inner resize-none"></textarea>
          </div>
          
          <button [disabled]="contactForm.invalid" class="w-full bg-black text-white font-black py-5 rounded-2xl text-xs uppercase tracking-[0.4em] hover:bg-[#ff0000] hover:shadow-[0_15px_30px_rgba(255,0,0,0.3)] disabled:opacity-30 transition-all active:scale-95">
            MESAJI GÖNDER
          </button>
        </form>
      </div>

      <div class="lg:col-span-5 flex flex-col gap-5">
        
        <div class="bg-white p-7 rounded-[2rem] border-2 border-gray-50 shadow-lg flex items-center gap-5 hover:border-[#00adef] transition-all group">
          <div class="w-14 h-14 bg-[#00adef]/10 rounded-2xl flex items-center justify-center text-[#00adef] group-hover:bg-[#00adef] group-hover:text-white transition-all">
            <lucide-icon name="map-pin" size="28"></lucide-icon>
          </div>
          <div>
            <h4 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-1">Atölye Adresimiz</h4>
            <p class="text-sm font-bold text-gray-800 leading-tight">İkitelli OSB, Dolapdere Sanayi Sitesi 22. Ada No: 42 Başakşehir / İSTANBUL</p>
          </div>
        </div>

        <div class="bg-white p-7 rounded-[2rem] border-2 border-gray-50 shadow-lg flex items-center gap-5 hover:border-[#ff0000] transition-all group">
          <div class="w-14 h-14 bg-[#ff0000]/10 rounded-2xl flex items-center justify-center text-[#ff0000] group-hover:bg-[#ff0000] group-hover:text-white transition-all">
            <lucide-icon name="phone-call" size="28"></lucide-icon>
          </div>
          <div>
            <h4 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-1">Müşteri Hattı</h4>
            <p class="text-lg font-black text-gray-900">+90 532 174 29 87</p>
          </div>
        </div>

        <a href="https://wa.me/905321742987" target="_blank" 
           class="bg-black p-7 rounded-[2rem] shadow-2xl flex items-center justify-between group hover:scale-[1.02] transition-all">
          <div class="flex items-center gap-5">
            <div class="w-14 h-14 bg-[#25D366]/20 rounded-2xl flex items-center justify-center text-[#25D366]">
              <lucide-icon name="message-circle" size="32"></lucide-icon>
            </div>
            <div>
              <h4 class="text-xs font-black text-white uppercase tracking-widest mb-1">WhatsApp Hattı</h4>
              <p class="text-[11px] text-[#25D366] font-bold uppercase italic">Anında Teklif Alın</p>
            </div>
          </div>
          <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white group-hover:bg-[#25D366] transition-all">
            <lucide-icon name="arrow-up-right" size="20"></lucide-icon>
          </div>
        </a>

        <div class="mt-4 p-6 bg-gray-50 rounded-[2rem] flex items-center justify-around border border-gray-100 shadow-inner">
          <a href="https://www.instagram.com/reparatiireconditionare/" target="_blank" class="w-12 h-12 flex items-center justify-center rounded-full bg-white shadow-md text-[#E4405F] hover:bg-[#E4405F] hover:text-white transition-all scale-110 hover:-translate-y-2">
            <lucide-icon name="instagram" size="22"></lucide-icon>
          </a>
          <a href="https://www.tiktok.com/@reparatii.reconditionare"target="_blank" class="w-12 h-12 flex items-center justify-center rounded-full bg-white shadow-md text-[#000000] hover:bg-[#000000] hover:text-white transition-all scale-110 hover:-translate-y-2">
            <lucide-icon name="music2" size="22"></lucide-icon> </a>
          <a href="https://wa.me/905321742987" target="_blank" class="w-12 h-12 flex items-center justify-center rounded-full bg-white shadow-md text-[#25D366] hover:bg-[#25D366] hover:text-white transition-all scale-110 hover:-translate-y-2">
            <lucide-icon name="message-circle" size="22"></lucide-icon>
          </a>
          <a href="https://www.facebook.com/reperatii.reconditionare" target="_blank" class="w-12 h-12 flex items-center justify-center rounded-full bg-white shadow-md text-[#1877F2] hover:bg-[#1877F2] hover:text-white transition-all scale-110 hover:-translate-y-2">
            <lucide-icon name="facebook" size="22"></lucide-icon>
          </a>
        </div>
      </div>

    </div>

    <div class="mt-16 w-full h-[400px] bg-white p-3 rounded-[3rem] shadow-2xl border border-gray-100 overflow-hidden relative group">
      <div class="absolute inset-0 bg-black/5 pointer-events-none group-hover:bg-transparent transition-all z-10"></div>
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3007.828598852377!2d28.7942!3d41.0772!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDHCsDA0JzM3LjkiTiAyOMKwNDcnMzkuMSJF!5e0!3m2!1str!2str!4v1620000000000!5m2!1str!2str" 
        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
      </iframe>
    </div>

  </div>
</section>


<div *ngIf="showToast" 
     class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[100] animate-bounce-in">
  <div [ngClass]="toastType === 'success' ? 'bg-[#25D366]' : 'bg-[#ff0000]'"
       class="flex items-center gap-4 px-8 py-4 rounded-2xl shadow-[0_20px_40px_rgba(0,0,0,0.2)] text-white min-w-[320px]">
    
    <lucide-icon [name]="toastType === 'success' ? 'check-circle' : 'alert-circle'" size="24"></lucide-icon>
    
    <div class="flex flex-col">
      <span class="text-[10px] font-black uppercase tracking-[0.2em] opacity-70">
        {{ toastType === 'success' ? 'Başarılı' : 'Hata' }}
      </span>
      <span class="text-sm font-bold uppercase tracking-tight">{{ toastMessage }}</span>
    </div>

    <button (click)="showToast = false" class="ml-auto hover:scale-110 transition-transform">
      <lucide-icon name="x" size="18"></lucide-icon>
    </button>
  </div>
</div>
