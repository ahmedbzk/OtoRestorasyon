<section class="relative min-h-[85vh] flex items-center justify-center bg-[#0a0a0a] overflow-hidden pt-32 pb-20">
  <!-- Background Elements -->
  <div class="absolute inset-0 z-0">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-[#00adef]/10 via-[#0a0a0a] to-[#0a0a0a]"></div>
  </div>

  <div class="container mx-auto px-6 relative z-10 text-center flex flex-col items-center">
    <!-- Animated 404 Text -->
    <h1 class="text-[150px] md:text-[200px] font-black leading-none tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-white via-white/80 to-white/10 select-none animate-pulse">
      {{ 'NOT_FOUND.TITLE' | translate }}
    </h1>
    
    <div class="w-24 h-1.5 bg-[#ff0000] rounded-full my-8 shadow-[0_0_15px_rgba(255,0,0,0.5)]"></div>

    <h2 class="text-3xl md:text-5xl font-black text-white uppercase tracking-tight mb-4">
      {{ 'NOT_FOUND.HEADING' | translate }}
    </h2>
    
    <p class="text-gray-400 text-lg md:text-xl font-light max-w-xl mx-auto mb-10 leading-relaxed">
      {{ 'NOT_FOUND.MESSAGE' | translate }}
    </p>

    <!-- Return Home Button -->
    <a routerLink="/" 
       class="group relative inline-flex items-center gap-3 bg-white text-black font-black px-8 py-4 rounded-2xl uppercase tracking-[0.2em] text-sm overflow-hidden transition-all hover:scale-105 active:scale-95 shadow-[0_10px_40px_rgba(255,255,255,0.2)]">
      <div class="absolute inset-0 bg-gradient-to-r from-[#00adef] to-[#ff0000] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
      
      <lucide-icon name="home" size="20" class="relative z-10 group-hover:text-white transition-colors duration-300"></lucide-icon>
      <span class="relative z-10 group-hover:text-white transition-colors duration-300">{{ 'NOT_FOUND.BACK_BUTTON' | translate }}</span>
    </a>
  </div>

  <!-- Decorative blur circles -->
  <div class="absolute -top-40 -right-40 w-96 h-96 bg-[#ff0000]/10 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-[#00adef]/10 rounded-full blur-[100px] pointer-events-none"></div>
</section>
